name: Deploy to Hetzner

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend tests
        working-directory: ./backend
        run: mvn -B test

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run frontend tests and build
        working-directory: ./frontend
        run: |
          npm ci
          npm test
          npm run build

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase owner
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/recipebook-backend:latest
            ghcr.io/${{ steps.owner.outputs.value }}/recipebook-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/recipebook-frontend:latest
            ghcr.io/${{ steps.owner.outputs.value }}/recipebook-frontend:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: GHCR_TOKEN,REPO_OWNER
          script: |
            REPO_OWNER=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')

            # Login to GitHub Container Registry
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$REPO_OWNER" --password-stdin

            # Pull latest images
            docker pull ghcr.io/$REPO_OWNER/recipebook-backend:latest
            docker pull ghcr.io/$REPO_OWNER/recipebook-frontend:latest

            # Create docker-compose.prod.yml
            cat > /opt/recipebook/docker-compose.prod.yml << 'EOF'
            version: '3.8'

            services:
              postgres:
                image: postgres:16-alpine
                container_name: recipebook-db
                hostname: postgres
                networks:
                  - recipebook_default
                environment:
                  POSTGRES_DB: recipebook
                  POSTGRES_USER: postgres
                  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U postgres -d recipebook"]
                  interval: 30s
                  timeout: 5s
                  retries: 3
                  start_period: 20s
                restart: unless-stopped

              backend:
                image: ghcr.io/phuturephil/recipebook-backend:latest
                container_name: recipebook-backend
                hostname: backend
                networks:
                  - recipebook_default
                expose:
                  - "8080"

                environment:
                  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/recipebook
                  SPRING_DATASOURCE_USERNAME: postgres
                  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
                  JWT_SECRET: ${JWT_SECRET}
                  JWT_EXPIRATION: ${JWT_EXPIRATION:-7776000000}
                  ADMIN_PASSWORD: ${ADMIN_PASSWORD}
                  APP_URL: https://pastoors.cloud
                  ALLOWED_ORIGIN: https://pastoors.cloud
                  OPENAI_API_KEY: ${OPENAI_API_KEY}
                  UNSPLASH_API_KEY: ${UNSPLASH_API_KEY}
                  SPRING_MAIL_HOST: ${MAIL_HOST}
                  SPRING_MAIL_PORT: ${MAIL_PORT}
                  SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
                  SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
                  SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
                  SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
                  OIDC_ENABLED: ${OIDC_ENABLED:-false}
                  OIDC_ISSUER_URI: https://auth.pastoors.cloud
                  OIDC_CLIENT_ID: recipebook
                  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
                depends_on:
                  postgres:
                    condition: service_healthy
                healthcheck:
                  test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8080/api/auth/oidc/status || exit 1"]
                  interval: 30s
                  timeout: 5s
                  retries: 3
                  start_period: 120s
                restart: unless-stopped

              frontend:
                image: ghcr.io/phuturephil/recipebook-frontend:latest
                container_name: recipebook-frontend
                hostname: frontend
                networks:
                  - recipebook_default
                expose:
                  - "443"
                volumes:
                  - /opt/ssl/pastoors.cloud:/etc/ssl/certs:ro
                depends_on:
                  - backend
                healthcheck:
                  test: ["CMD-SHELL", "curl -skf -o /dev/null https://127.0.0.1/ || exit 1"]
                  interval: 30s
                  timeout: 5s
                  retries: 3
                  start_period: 10s
                restart: unless-stopped

            networks:
              recipebook_default:
                external: true

            volumes:
              postgres_data:
            EOF

            # Create network if not exists
            docker network create recipebook_default 2>/dev/null || true

            # Remove old containers
            docker rm -f recipebook-db recipebook-backend recipebook-frontend 2>/dev/null || true

            # Start containers - secrets are loaded from .env file
            docker compose --env-file /opt/recipebook/.env -f /opt/recipebook/docker-compose.prod.yml up -d
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
