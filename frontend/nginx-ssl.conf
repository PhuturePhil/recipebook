# HTTP -> HTTPS Redirect
server {
    listen 80;
    server_name pastoors.cloud www.pastoors.cloud;

    return 301 https://$host$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name pastoors.cloud www.pastoors.cloud;

    # SSL Zertifikate (Porkbun)
    ssl_certificate /etc/ssl/certs/domain.cert.pem;
    ssl_certificate_key /etc/ssl/certs/private.key.pem;

    # SSL Einstellungen (modern)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # www -> non-www Redirect
    if ($host = www.pastoors.cloud) {
        return 301 https://pastoors.cloud$request_uri;
    }

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /share/ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow";
    }

    # Teilen-Link: index.html mit Titel + Open-Graph-Tags des Rezepts (Link-Vorschau in Messengern).
    # Die Tags kommen per SSI vom Backend, fällt es aus, bleibt der feste Titel (frontend/src/utils/shareShell.js).
    location ~ "^/share/(?<share_token>[A-Za-z0-9_-]{1,64})/?$" {
        ssi on;
        try_files /share-shell.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow";
    }

    location = /share-shell.html {
        internal;
    }

    # Kopfzeilen für die Teilen-Seite; Fehler oder Ausfall des Backends ergeben einen leeren Body,
    # dann setzt SSI den festen Titel aus share-shell.html ein.
    location ~ "^/share-head/(?<share_head_token>[A-Za-z0-9_-]{1,64})$" {
        internal;
        rewrite ^ /api/share/$share_head_token/head break;
        proxy_pass http://recipebook-backend:8080;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;
        error_page 400 403 404 410 500 502 503 504 = @share_head_empty;
    }

    location @share_head_empty {
        return 204;
    }

    location /api/ {
        client_max_body_size 20m;
        proxy_pass http://recipebook-backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
